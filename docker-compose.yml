name: PORTAL

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://imposter_users:imposter_password_2026@imposter-db:5432/imposter_db
    networks:
      - default
      - imposter-project_imposter-network

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "16000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

networks:
  imposter-project_imposter-network:
    external: true